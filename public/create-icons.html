<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const r = size * 0.15;

  // Background
  ctx.fillStyle = '#050816';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();

  // Gold gradient
  const g = ctx.createLinearGradient(size*0.2, size*0.2, size*0.8, size*0.8);
  g.addColorStop(0, '#E8C87A');
  g.addColorStop(1, '#C8A96E');

  // F letter
  ctx.fillStyle = g;
  ctx.font = `bold ${size*0.55}px "Space Grotesk", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('F', size/2, size/2 + size*0.04);

  console.log(id, c.toDataURL());
}
drawIcon('c192', 192);
drawIcon('c512', 512);
</script>
</body>
</html>
